<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Time tracking dashboard</title>
  <link rel="stylesheet" type="text/css" href="styles/styles.css">
</head>
<body>

  <article>
    <div id="sec-1" class="section">
      <div id="name">
        <img src="images/image-jeremy.png" alt="Profile Picture">
        <div>
        <p>Report for</p>
        <h1>Jeremy Robson</h1>
        </div>
      </div>
      <ul id="tabs">
        <li id="daily">Daily</li>
        <li id="weekly">Weekly</li>
        <li id="monthly">Monthly</li>
      </ul>
    </div>

    <div id="work-section" class="section">
      <div id="work-top" class="top"></div>
      <div id="work-info" class="info"> <!--bottom section with info-->
        <div class="title-row">
          Work
          <img src="images/icon-ellipsis.svg" alt="" aria-disabled="true">
        </div>
        <div id="work-numbers" class="numbers">
          <h1 id="work-current" class="current">hrs</h1>
          <p id="work-previous" class="previous">Last Week - hrs</p>
        </div>
      </div>
    </div>

    <div id="play-section" class="section">
      <div id="play-top" class="top"></div>
      <div id="play-info" class="info"> <!--bottom section with info-->
        <div class="title-row">
          Play
          <img src="images/icon-ellipsis.svg" alt="" aria-disabled="true">
        </div>
        <div id="play-numbers" class="numbers">
          <h1 id="play-current" class="current">hrs</h1>
          <p id="play-previous" class="previous">Last Week - hrs</p>
        </div>
      </div>
    </div>

    <div id="study-section" class="section">
      <div id="study-top" class="top"></div>
      <div id="study-info" class="info"> <!--bottom section with info-->
        <div class="title-row">
          Study
          <img src="images/icon-ellipsis.svg" alt="" aria-disabled="true">
        </div>
        <div id="study-numbers" class="numbers">
          <h1 id="study-current" class="current">hrs</h1>
          <p id="study-previous" class="previous">Last Week - hrs</p>
        </div>
      </div>
    </div>

    <div id="exercise-section" class="section">
      <div id="exercise-top" class="top"></div>
      <div id="exercise-info" class="info"> <!--bottom section with info-->
        <div class="title-row">
          Exercise
          <img src="images/icon-ellipsis.svg" alt="" aria-disabled="true">
        </div>
        <div id="exercise-numbers" class="numbers">
          <h1 id="exercise-current" class="current">hrs</h1>
          <p id="exercise-previous" class="previous">Last Week - hrs</p>
        </div>
      </div>
    </div>

    <div id="social-section" class="section">
      <div id="social-top" class="top"></div>
      <div id="social-info" class="info"> <!--bottom section with info-->
        <div class="title-row">
          Social
          <img src="images/icon-ellipsis.svg" alt="" aria-disabled="true">
        </div>
        <div id="social-numbers" class="numbers">
          <h1 id="social-current" class="current">hrs</h1>
          <p id="social-previous" class="previous">Last Week - hrs</p>
        </div>
      </div>
    </div>

    <div id="self-care-section" class="section">
      <div id="self-care-top" class="top"></div>
      <div id="self-care-info" class="info"> <!--bottom section with info-->
        <div class="title-row">
          Self Care
          <img src="images/icon-ellipsis.svg" alt="" aria-disabled="true">
        </div>
        <div id="self-care-numbers" class="numbers">
          <h1 id="self-care-current" class="current">hrs</h1>
          <p id="self-care-previous" class="previous">Last Week - hrs</p>
        </div>
      </div>
    </div>
  </article>
  <script type="module" src="index.js"></script>
</body>
</html>
